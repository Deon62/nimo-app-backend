# Render Blueprint: New → Blueprint → pick this repo. Secrets marked `sync: false` are asked for once.
services:
  - type: web
    name: nimo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:8081
      # PUBLIC_BASE_URL defaults to Render's RENDER_EXTERNAL_URL; set it only for a custom domain.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://nimo.ardena.co.ke/payment-complete/
      - key: DARAJA_ENV
        value: sandbox
      - key: DARAJA_CONSUMER_KEY
        sync: false
      - key: DARAJA_CONSUMER_SECRET
        sync: false
      - key: DARAJA_SHORTCODE
        value: "174379"
      - key: DARAJA_PASSKEY
        sync: false
      - key: DARAJA_CALLBACK_TOKEN
        generateValue: true
      - key: SEND_SMS_HOOK_SECRET
        sync: false
      - key: CELCOM_API_KEY
        sync: false
      - key: CELCOM_PARTNER_ID
        sync: false
      - key: CELCOM_SHORTCODE
        sync: false
